auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 0

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Retention: without this block Loki keeps chunks forever (measured
# 2026-09-06: 12 GB back to March on the VPS's 40 GB disk). The compactor
# owns deletion; delete_request_store is mandatory in Loki 3.x when
# retention_enabled is true.
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50
  delete_request_store: filesystem

limits_config:
  retention_period: 720h  # 30d — matches reject_old_samples_max_age
  reject_old_samples: true
  reject_old_samples_max_age: 720h
  # Allow promtail to backfill log lines that pre-date the stream's
  # current high-watermark by up to 30 days. Without this, after a
  # promtail outage, queued entries from earlier in the day get
  # rejected as 'entry too far behind' even though they're well
  # within reject_old_samples_max_age.
  unordered_writes: true
  max_global_streams_per_user: 50000
  # Cluster Promtail will roughly 4-5x current ingest. Bump from defaults so
  # bursts during pod startup don't get rate-limited.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
