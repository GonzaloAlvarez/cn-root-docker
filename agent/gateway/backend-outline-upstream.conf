# Outline upstream settings: traefik-lab inside ts-infra's netns, reached over
# the docker bridge, presenting the LE wildcard for outline.lab.gn.al. Full TLS
# verification against the system roots — no insecureSkipVerify at this hop.
proxy_http_version 1.1;
proxy_set_header Host outline.lab.gn.al;
proxy_set_header Connection "";
proxy_set_header Upgrade "";
proxy_set_header Cookie "";                  # a browser session must never ride the tunnel
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header X-Real-IP "";
proxy_set_header X-HTTP-Method-Override "";
proxy_set_header X-Method-Override "";
proxy_hide_header Set-Cookie;
proxy_ssl_server_name on;
proxy_ssl_name outline.lab.gn.al;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_session_reuse on;
proxy_connect_timeout 5s;
proxy_send_timeout    10s;
proxy_read_timeout    30s;
proxy_request_buffering on;                   # body fully read + size-checked before forwarding
proxy_buffering on;
proxy_buffers 16 16k;
proxy_max_temp_file_size 0;                   # never spill responses to disk
