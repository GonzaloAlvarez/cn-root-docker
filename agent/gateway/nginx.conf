# agent-api-gw — forwarding-only allowlist proxy for external agents.
#
# Reachable ONLY via the VPS loopback publish 127.0.0.1:8093, which itself is
# reachable only through sshd's `Match User agent` block (PermitOpen
# 127.0.0.1:8093). Nothing here is on the public surface.
#
# This file is the backend-agnostic frame: logging, limits, temp paths, the
# JSON-only check. Everything that knows about Outline lives in
# backend-outline.conf (allowlist + bearer shape) and
# backend-outline-upstream.conf (Host/SNI/TLS). Swapping the memory backend =
# writing a new backend-*.conf pair and switching the include below; the SSH
# side, the port and the client tunnel command do not change.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    # nginx-unprivileged + read_only rootfs: everything writable lives in /tmp (tmpfs).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    default_type  application/json;
    merge_slashes on;

    # Structured access log: NO Authorization header, NO raw query string, NO body.
    # $uri is the normalised path the allowlist decision was made on.
    log_format agent escape=json
        '{"ts":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","has_args":"$is_args","status":"$status","bytes":$body_bytes_sent,'
        '"req_len":$request_length,"rt":$request_time,"up_status":"$upstream_status",'
        '"up_rt":"$upstream_response_time","ua":"$http_user_agent"}';
    access_log /dev/stdout agent;

    # Docker embedded DNS. ts-infra's bridge IP is dynamic (.128/25 range), so the
    # upstream is a variable and nginx re-resolves it every 30s.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    limit_req_zone  $binary_remote_addr zone=agent_req:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=agent_conn:1m;
    limit_req_status  429;
    limit_conn_status 429;

    map $content_type $agent_ct_ok {
        default 0;
        "~^application/json" 1;
    }

    client_max_body_size    512k;   # documents.create/update carry markdown text
    client_body_buffer_size 512k;
    client_header_timeout   10s;
    client_body_timeout     10s;
    keepalive_timeout       65s;

    # Backend: defines the $agent_auth_ok map and the allowlisting server block.
    include /etc/nginx/agent/backend-outline.conf;
}
