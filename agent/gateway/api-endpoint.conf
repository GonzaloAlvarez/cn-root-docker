# Included by every allowlisted `location = /api/<method>`.
# The SSH tunnel IS the authentication: only the sshd `Match User agent` loopback
# forward can reach the 127.0.0.1:8093 publish, which docker's userland proxy
# presents from the bridge gateway 172.18.0.1. Other bridge containers are denied.
# The Outline token is injected server-side (backend-outline-upstream.conf); the
# client sends no credential.
allow 172.18.0.1;
deny  all;
limit_req  zone=agent_req burst=20 nodelay;
limit_conn agent_conn 10;
if ($request_method != POST) { return 405 '{"ok":false,"error":"method_not_allowed"}'; }
if ($agent_ct_ok = 0)        { return 415 '{"ok":false,"error":"json_only"}'; }
set $upstream ts-infra;
# $uri equals the exact location literal (., .., //, %2e already normalised).
# NEVER $request_uri and never a URI-less proxy_pass — both would relay the raw
# form. The query string is deliberately dropped (Outline accepts ?token=).
proxy_pass https://$upstream$uri;
include /etc/nginx/agent/backend-outline-upstream.conf;
