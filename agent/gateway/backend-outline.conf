# Outline backend for agent-api-gw: the method allowlist. Keep it IDENTICAL to
# the scope of the injected token (documented in agent/README.md).
#
# The client presents NO Outline credential — the SSH tunnel key is the only
# client factor, and agent-api-gw injects the token server-side (see
# backend-outline-upstream.conf). Reaching this server block already means the
# request arrived through the sshd `Match User agent` loopback forward.

server {
    listen 8080 default_server;
    server_name _;

    # Default: everything not explicitly allowlisted below is denied.
    location / { return 403 '{"ok":false,"error":"gateway_forbidden"}'; }
    # Oversize bodies (client_max_body_size) answer in the same JSON shape as every other refusal.
    error_page 413 = @too_large;
    location @too_large { return 413 '{"ok":false,"error":"body_too_large"}'; }

    # Local liveness (no upstream): docker healthcheck (127.0.0.1) + blackbox (bridge).
    location = /healthz {
        allow 127.0.0.1; allow 172.18.0.0/16; deny all;
        return 200 '{"ok":true,"gw":"agent-api-gw","backend":"outline"}';
    }
    # Full path: same DNS/TLS/SNI/Host hop as the API, hits Outline's unauthenticated /_health.
    location = /healthz/upstream {
        allow 127.0.0.1; allow 172.18.0.0/16; deny all;
        set $upstream ts-infra;
        proxy_pass https://$upstream/_health;
        include /etc/nginx/agent/backend-outline-upstream.conf;
    }

    # ── Outline API allowlist — EXACT matches only (no prefix locations). ──────
    # read
    location = /api/auth.info             { include /etc/nginx/agent/api-endpoint.conf; }
    location = /api/collections.list      { include /etc/nginx/agent/api-endpoint.conf; }
    location = /api/collections.info      { include /etc/nginx/agent/api-endpoint.conf; }
    location = /api/collections.documents { include /etc/nginx/agent/api-endpoint.conf; }
    location = /api/documents.list        { include /etc/nginx/agent/api-endpoint.conf; }
    location = /api/documents.info        { include /etc/nginx/agent/api-endpoint.conf; }
    location = /api/documents.search      { include /etc/nginx/agent/api-endpoint.conf; }
    # write — Outline confines these to collections where `agent` holds read_write (Memories)
    location = /api/documents.create      { include /etc/nginx/agent/api-endpoint.conf; }
    location = /api/documents.update      { include /etc/nginx/agent/api-endpoint.conf; }
    location = /api/documents.archive     { include /etc/nginx/agent/api-endpoint.conf; }
    location = /api/documents.restore     { include /etc/nginx/agent/api-endpoint.conf; }
    location = /api/documents.delete      { include /etc/nginx/agent/api-endpoint.conf; }
    # uploads (2026-10-04) — two steps. attachments.create (JSON: name, contentType, size
    # [, documentId]) registers the file and returns `uploadUrl` (/api/files.create —
    # RELATIVE: the client calls it on this same gateway) plus the `form` fields;
    # files.create (multipart/form-data: those fields + `file`) carries the bytes. Outline
    # accepts bytes only for an attachment the SAME user registered, so the second step
    # cannot write anywhere else. Pages embed the result as
    # ![name](/api/attachments.redirect?id=<attachment id>).
    location = /api/attachments.create    { include /etc/nginx/agent/api-endpoint.conf; }
    location = /api/files.create          { include /etc/nginx/agent/api-upload-endpoint.conf; }
    # Deliberately NOT allowlisted: documents.move (cross-collection), documents.import,
    # documents.export, attachments.list/delete/redirect/createFromUrl, files.get (downloads:
    # the agent writes images, it never reads them back), shares.*, apiKeys.*, users.*,
    # groups.*, team.*, events.*, revisions.*, views.*, /realtime and every UI path.
}
