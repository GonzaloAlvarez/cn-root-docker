# Included ONLY by `location = /api/files.create` — the second half of an upload.
# Same guards as api-endpoint.conf (source must be the host loopback publish, rate
# and connection limits, POST only, normalised $uri with the query string dropped,
# server-side token injection) with two deliberate differences:
#   * the body is multipart/form-data — the `form` fields that attachments.create
#     returned plus the file bytes — instead of JSON;
#   * it may be as large as Outline's own FILE_STORAGE_UPLOAD_MAX_SIZE (25 MB on
#     cn-outline). Every other method keeps the global 512 KB.
# The body is still read and size-checked completely (proxy_request_buffering) before
# anything is forwarded; bodies above client_body_buffer_size spill to the tmpfs /tmp
# (never to the read-only rootfs). Outline writes the bytes only to an attachment the
# same user registered seconds earlier, so this cannot overwrite anything else.
allow 172.18.0.1;
deny  all;
limit_req  zone=agent_req burst=20 nodelay;
limit_conn agent_conn 10;
client_max_body_size 25m;
if ($request_method != POST)  { return 405 '{"ok":false,"error":"method_not_allowed"}'; }
if ($agent_ct_upload_ok = 0)  { return 415 '{"ok":false,"error":"multipart_only"}'; }
set $upstream ts-infra;
proxy_pass https://$upstream$uri;
include /etc/nginx/agent/backend-outline-upstream.conf;
