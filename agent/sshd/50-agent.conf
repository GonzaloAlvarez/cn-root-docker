# /etc/ssh/sshd_config.match.d/50-agent.conf
# Installed by cn-root-docker/agent/sshd/install.sh. Forwarding-only account for
# external agents: exactly one local TCP forward to 127.0.0.1:8093 (agent-api-gw).
# No shell, no sessions, nothing else.
#
# Reached via `Include /etc/ssh/sshd_config.match.d/*.conf` appended at the END
# of /etc/ssh/sshd_config, in its own directory: Match blocks are kept apart
# from Debian's global drop-ins (sshd_config.d, Included at line 12) so they can
# never shadow a global directive by ordering. (Verified on OpenSSH 9.2: a Match
# inside an Included file is scoped to that file — globals after the Include
# survive — so this is hygiene, not a bug workaround.)
Match User agent
    AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAcceptedAlgorithms ssh-ed25519
    MaxAuthTries 3
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8093
    PermitListen none
    GatewayPorts no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
    ForceCommand /bin/false
    MaxSessions 0
    ChannelTimeout direct-tcpip=15m
    ClientAliveInterval 30
    ClientAliveCountMax 3
    LogLevel VERBOSE
    Banner none
